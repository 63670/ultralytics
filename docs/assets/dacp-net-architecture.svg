<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">DACP-Net architecture</title>
  <desc id="desc">DACP-Net uses a YOLOv8n backbone enhanced by dual-axis texture encoding, a local texture-guided reassembly pyramid, a PAN aggregation path and three-scale detection heads.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px Arial, sans-serif; fill: #475569; }
      .section { font: 700 18px Arial, sans-serif; fill: #334155; letter-spacing: 1px; }
      .label { font: 700 15px Arial, sans-serif; fill: #172554; }
      .small { font: 13px Arial, sans-serif; fill: #334155; }
      .tiny { font: 12px Arial, sans-serif; fill: #475569; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.4; marker-end: url(#arrow); }
      .skip { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .node { stroke: #334155; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>
  <rect width="1600" height="920" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="title">DACP-Net: Dual-Axis Texture Encoding and Local Texture-Guided Reassembly</text>
  <text x="800" y="76" text-anchor="middle" class="subtitle">YOLOv8n-based detector for fabric-defect detection</text>

  <rect x="32" y="112" width="500" height="748" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="144" class="section">1. FEATURE BACKBONE</text>
  <text x="56" y="168" class="subtitle">YOLOv8n backbone with DATE blocks</text>

  <rect x="62" y="422" width="100" height="72" class="node" fill="#e0f2fe"/>
  <text x="112" y="453" text-anchor="middle" class="label">Input</text>
  <text x="112" y="475" text-anchor="middle" class="small">640 × 640</text>
  <path d="M162 458 L202 458" class="flow"/>

  <rect x="204" y="422" width="132" height="72" class="node" fill="#dbeafe"/>
  <text x="270" y="451" text-anchor="middle" class="label">Stem Conv</text>
  <text x="270" y="473" text-anchor="middle" class="small">P1 / P2</text>
  <path d="M336 458 L378 458" class="flow"/>

  <rect x="380" y="210" width="122" height="74" class="node" fill="#fef3c7"/>
  <text x="441" y="239" text-anchor="middle" class="label">C2f + DATE</text>
  <text x="441" y="261" text-anchor="middle" class="small">P2 / 4</text>
  <rect x="380" y="330" width="122" height="74" class="node" fill="#fde68a"/>
  <text x="441" y="359" text-anchor="middle" class="label">C2f + DATE</text>
  <text x="441" y="381" text-anchor="middle" class="small">P3 / 8</text>
  <rect x="380" y="510" width="122" height="74" class="node" fill="#fde68a"/>
  <text x="441" y="539" text-anchor="middle" class="label">C2f + DATE</text>
  <text x="441" y="561" text-anchor="middle" class="small">P4 / 16</text>
  <rect x="380" y="690" width="122" height="74" class="node" fill="#fef3c7"/>
  <text x="441" y="719" text-anchor="middle" class="label">C2f + DATE</text>
  <text x="441" y="741" text-anchor="middle" class="small">P5 / 32 + SPPF</text>
  <path d="M270 458 L350 458 L350 247 L380 247" class="flow"/>
  <path d="M441 284 L441 330" class="flow"/>
  <path d="M441 404 L441 510" class="flow"/>
  <path d="M441 584 L441 690" class="flow"/>
  <rect x="68" y="704" width="238" height="102" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="187" y="736" text-anchor="middle" class="label">DATE</text>
  <text x="187" y="758" text-anchor="middle" class="small">Dual-Axis Texture Encoding</text>
  <text x="187" y="780" text-anchor="middle" class="tiny">horizontal + vertical structural cues</text>

  <rect x="566" y="112" width="610" height="748" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="592" y="144" class="section">2. LOCAL TEXTURE-GUIDED REASSEMBLY PYRAMID</text>
  <text x="592" y="168" class="subtitle">top-down reassembly followed by bottom-up PAN aggregation</text>

  <rect x="620" y="680" width="150" height="70" class="node" fill="#e0e7ff"/>
  <text x="695" y="708" text-anchor="middle" class="label">P5 feature</text>
  <text x="695" y="730" text-anchor="middle" class="small">deep semantics</text>
  <rect x="620" y="500" width="150" height="70" class="node" fill="#e0e7ff"/>
  <text x="695" y="528" text-anchor="middle" class="label">P4 feature</text>
  <text x="695" y="550" text-anchor="middle" class="small">mid-level texture</text>
  <rect x="620" y="320" width="150" height="70" class="node" fill="#e0e7ff"/>
  <text x="695" y="348" text-anchor="middle" class="label">P3 feature</text>
  <text x="695" y="370" text-anchor="middle" class="small">fine defects</text>
  <path d="M502 727 L620 715" class="flow"/>
  <path d="M502 547 L620 535" class="flow"/>
  <path d="M502 367 L620 355" class="flow"/>

  <rect x="818" y="620" width="170" height="72" class="node" fill="#dcfce7"/>
  <text x="903" y="648" text-anchor="middle" class="label">LTFR ×2</text>
  <text x="903" y="670" text-anchor="middle" class="small">P5 → P4</text>
  <rect x="818" y="440" width="170" height="72" class="node" fill="#dcfce7"/>
  <text x="903" y="468" text-anchor="middle" class="label">LTFR ×2</text>
  <text x="903" y="490" text-anchor="middle" class="small">P4 → P3</text>
  <path d="M770 715 L818 656" class="flow"/>
  <path d="M903 620 L903 512" class="flow"/>
  <path d="M770 535 L800 535 L800 476 L818 476" class="skip"/>
  <path d="M770 355 L790 355 L790 404 L1010 404 L1010 476 L988 476" class="skip"/>

  <rect x="1014" y="320" width="128" height="70" class="node" fill="#d1fae5"/>
  <text x="1078" y="348" text-anchor="middle" class="label">FPN-P3</text>
  <text x="1078" y="370" text-anchor="middle" class="small">fusion</text>
  <rect x="1014" y="500" width="128" height="70" class="node" fill="#d1fae5"/>
  <text x="1078" y="528" text-anchor="middle" class="label">PAN-P4</text>
  <text x="1078" y="550" text-anchor="middle" class="small">fusion</text>
  <rect x="1014" y="680" width="128" height="70" class="node" fill="#d1fae5"/>
  <text x="1078" y="708" text-anchor="middle" class="label">PAN-P5</text>
  <text x="1078" y="730" text-anchor="middle" class="small">fusion</text>
  <path d="M988 476 L1014 355" class="flow"/>
  <path d="M1078 390 L1078 500" class="flow"/>
  <path d="M1078 570 L1078 680" class="flow"/>
  <rect x="810" y="770" width="300" height="58" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="960" y="796" text-anchor="middle" class="label">LTFR: Local Texture-Guided Reassembly</text>
  <text x="960" y="816" text-anchor="middle" class="tiny">dynamic 5 × 5 local kernels replace fixed nearest-neighbor upsampling</text>

  <rect x="1208" y="112" width="360" height="748" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1234" y="144" class="section">3. MULTI-SCALE DETECTION</text>
  <text x="1234" y="168" class="subtitle">anchor-free YOLOv8 Detect head</text>
  <rect x="1260" y="300" width="150" height="78" class="node" fill="#fee2e2"/>
  <text x="1335" y="330" text-anchor="middle" class="label">Detect P3</text>
  <text x="1335" y="352" text-anchor="middle" class="small">small defects</text>
  <rect x="1260" y="480" width="150" height="78" class="node" fill="#fee2e2"/>
  <text x="1335" y="510" text-anchor="middle" class="label">Detect P4</text>
  <text x="1335" y="532" text-anchor="middle" class="small">medium defects</text>
  <rect x="1260" y="660" width="150" height="78" class="node" fill="#fee2e2"/>
  <text x="1335" y="690" text-anchor="middle" class="label">Detect P5</text>
  <text x="1335" y="712" text-anchor="middle" class="small">large defects</text>
  <path d="M1142 355 L1260 339" class="flow"/>
  <path d="M1142 535 L1260 519" class="flow"/>
  <path d="M1142 715 L1260 699" class="flow"/>
  <rect x="1432" y="440" width="104" height="150" class="node" fill="#fce7f3"/>
  <text x="1484" y="478" text-anchor="middle" class="label">Output</text>
  <text x="1484" y="505" text-anchor="middle" class="small">row</text>
  <text x="1484" y="529" text-anchor="middle" class="small">col</text>
  <text x="1484" y="553" text-anchor="middle" class="small">hole</text>
  <path d="M1410 339 L1420 339 L1420 475 L1432 475" class="flow"/>
  <path d="M1410 519 L1432 519" class="flow"/>
  <path d="M1410 699 L1420 699 L1420 553 L1432 553" class="flow"/>
  <text x="800" y="892" text-anchor="middle" class="subtitle">Solid arrows: feature flow · dashed arrows: lateral feature fusion · DATE and LTFR are the proposed components.</text>
</svg>
