    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243746" x="844.2" y="148.783828" transform="rotate(-0 844.2 148.783828)">+</text>
   </g>
   <g id="text_20">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243746" x="795" y="274.36125" transform="rotate(-0 795 274.36125)">G ⊙ (B − N)</text>
   </g>
   <g id="text_21">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(896.690156 138.378984)">Output Y</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(886.535625 152.300859)">C × 2H × 2W</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243746" x="492" y="477.841875" transform="rotate(-0 492 477.841875)">Y = N + G ⊙ (B − N) = (1 − G) ⊙ N + G ⊙ B</text>
   </g>
   <g id="text_23">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243746" x="492" y="501.91125" transform="rotate(-0 492 501.91125)">Initialization: Conv weights = 0; bias = −2.7 → G = 0.05 → Y = 0.95N + 0.05B.</text>
