   <g id="text_24">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #566876" x="492" y="522.035313" transform="rotate(-0 492 522.035313)">One learned gate per spatial location. Channels are preserved; the output is a pointwise convex combination.</text>
