# YOLOv8n fabric-defect detector with P4/P5 end-to-end output
nc: 3 # horizontal defect, vertical defect, hole
end2end: True # use one-to-one inference without NMS
reg_max: 1 # direct box regression without DFL
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

# YOLOv8n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2fDirectional, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2fDirectional, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32

# P4 and P5 detection heads
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 12
  - [-1, 1, PartialDirectionalConv, [512, 0.125, 11]] # 13 partial-channel P4 directional fusion
  - [[-1, 9], 1, Detect, [nc]] # Detect(P4, P5)
