# Keep the original DME backbone; replace only the two CAFR upsampling blocks with Phase.
nc: 3 # row, col, hole
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2fDirectional, [128, True]] # 2-P2 DME
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2fDirectional, [256, True]] # 4-P3 DME
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2fDirectional, [512, True]] # 6-P4 DME
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2fDirectional, [1024, True]] # 8-P5 DME
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, PhaseAwareUpsample, [2]] # 10 P5-to-P4
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, PhaseAwareUpsample, [2]] # 13 P4-to-P3
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]] # 15-P3
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # 18-P4
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]] # 21-P5
  - [[15, 18, 21], 1, Detect, [nc]]
