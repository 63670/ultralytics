# Controlled placement ablation: refine P5 -> P4 only; keep P4 -> P3 as nearest interpolation.
# Original backbone, layer indices, Detect head and existing parameter names remain unchanged.
nc: 3
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2fAxisResidual, [256, True, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2fAxisResidual, [512, True, 0.25]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, ContentAwareUpsampleLite, [3, 16]] # 10: P5 -> P4, C=256 -> 16 latent channels
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13: P4 -> P3, no dynamic residual
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [[15, 18, 21], 1, Detect, [nc]]
