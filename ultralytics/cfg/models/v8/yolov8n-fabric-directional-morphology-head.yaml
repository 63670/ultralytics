# Experiment 2: morphology-adaptive detection head on the all-directional YOLOv8n backbone.
# Only P3/P4/P5 detection features are adapted; the official PAN-FPN and Detect module are unchanged.
nc: 3 # row, col, hole
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2fDirectional, [128, True]] # 2-P2 directional texture encoding
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2fDirectional, [256, True]] # 4-P3 directional structural encoding
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2fDirectional, [512, True]] # 6-P4 directional semantic encoding
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2fDirectional, [1024, True]] # 8-P5 global directional encoding
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32

# Official YOLOv8 PAN-FPN followed by morphology-adaptive detection feature refinement
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 15-P3/8

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 18-P4/16

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2f, [1024]] # 21-P5/32

  - [15, 1, MorphologyAdaptiveHead, [256, 2]] # 22-P3 local region adaptation
  - [18, 1, MorphologyAdaptiveHead, [512, 2]] # 23-P4 morphology adaptation
  - [21, 1, MorphologyAdaptiveHead, [1024, 2]] # 24-P5 contextual morphology adaptation
  - [[22, 23, 24], 1, Detect, [nc]] # Detect(P3, P4, P5)
