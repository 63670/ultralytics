# Experiment 2: training-only multi-scale semantic consistency on full directional YOLOv8n.
# Native YOLOv8 classification and regression branches remain decoupled. Positive regions shared by adjacent P3/P4/P5
# levels receive a class-probability consistency constraint; inference architecture and output remain unchanged.
nc: 3 # row, col, hole
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2fDirectional, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2fDirectional, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2fDirectional, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2fDirectional, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # 12 P4 top-down
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]] # 15 P3
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # 18 P4
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]] # 21 P5
  - [[15, 18, 21], 1, ScaleConsistentDetect, [nc, 0.05]] # training-only consistency weight
