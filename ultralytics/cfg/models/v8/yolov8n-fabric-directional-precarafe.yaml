# WWTE-before-C2f experiment: directional texture encoding is applied before
# the original C2f feature-reuse topology. The CARAFE-style LTFR head is kept
# identical to DACP-Net so this configuration isolates the placement of WWTE.
nc: 3 # row, col, hole
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2fDirectionalPre, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2fDirectionalPre, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2fDirectionalPre, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2fDirectionalPre, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, ContentAwareUpsample, [5, 2]] # P5-to-P4 dynamic reassembly
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # P4 top-down
  - [-1, 1, ContentAwareUpsample, [5, 2]] # P4-to-P3 dynamic reassembly
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]] # P3
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # P4
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]] # P5
  - [[15, 18, 21], 1, Detect, [nc]]
