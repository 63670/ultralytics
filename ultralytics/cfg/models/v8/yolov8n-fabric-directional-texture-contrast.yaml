# Experiment 2: texture-consistency-disruption fusion on the full directional YOLOv8n backbone.
# P3 detail is compared with dilated local context, and P4 semantics gate the resulting anomaly response before the
# standard P3-to-P4 PAN fusion. The original P3/P4/P5 Detect head is retained.
nc: 3 # row, col, hole
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2fDirectional, [128, True]] # 2-P2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2fDirectional, [256, True]] # 4-P3
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2fDirectional, [512, True]] # 6-P4
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2fDirectional, [1024, True]] # 8-P5
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # 11 cat backbone P4
  - [-1, 3, C2f, [512]] # 12 top-down P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # 14 cat backbone P3
  - [-1, 3, C2f, [256]] # 15 P3 detail

  - [[15, 12], 1, TextureContrastFusion, [3]] # 16 P3 texture anomaly gated by P4 semantics
  - [-1, 1, Conv, [256, 3, 2]] # 17 P3-to-P4 PAN downsample
  - [[-1, 12], 1, Concat, [1]] # 18 cat top-down P4
  - [-1, 3, C2f, [512]] # 19 P4

  - [-1, 1, Conv, [512, 3, 2]] # 20 P4-to-P5 PAN downsample
  - [[-1, 9], 1, Concat, [1]] # 21 cat P5
  - [-1, 3, C2f, [1024]] # 22 P5

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
