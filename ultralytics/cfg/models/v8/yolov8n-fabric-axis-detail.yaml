# Experimental partial-axis C2f backbone and compressed shallow-detail pyramid.
# Keep baseline stage widths, layer indices and the P3/P4/P5 detection head for partial weight transfer.
nc: 3 # row, col, hole
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # C2fPartialAxis args: [output_channels, shortcut, processed_channel_fraction, axial_context]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2fPartialAxis, [128, True, 0.25, False]] # 2-P2 local detail
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2fPartialAxis, [256, True, 0.25, True]] # 4-P3 row/column context
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2fPartialAxis, [512, True, 0.25, True]] # 6-P4 row/column context
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2fPartialAxis, [1024, True, 0.25, False]] # 8-P5 compact local processing
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 6], 1, Concat, [1]] # 11
  - [-1, 3, C2f, [512]] # 12-P4 top-down
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 4], 1, Concat, [1]] # 14
  # args: [output_channels (width-scaled), detail_channels (absolute, not width-scaled)]
  - [[-1, 2], 3, C2fDetailFusion, [256, 8]] # 15-P3 + compressed P2 detail
  - [-1, 1, Conv, [256, 3, 2]] # 16
  - [[-1, 12], 1, Concat, [1]] # 17
  - [-1, 3, C2f, [512]] # 18-P4
  - [-1, 1, Conv, [512, 3, 2]] # 19
  - [[-1, 9], 1, Concat, [1]] # 20
  - [-1, 3, C2f, [1024]] # 21-P5
  - [[15, 18, 21], 1, Detect, [nc]] # 22
