# C2f-WWTE experiment: WWTE is embedded between the two spatial convolutions
# of each progressive C2f bottleneck. The CSP split, feature reuse, and C2f
# output aggregation remain unchanged. LTFR is identical to DACP-Net.
nc: 3 # row, col, hole
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2fWWTE, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2fWWTE, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2fWWTE, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2fWWTE, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, ContentAwareUpsample, [5, 2]] # P5-to-P4 dynamic reassembly
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # P4 top-down
  - [-1, 1, ContentAwareUpsample, [5, 2]] # P4-to-P3 dynamic reassembly
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]] # P3
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # P4
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]] # P5
  - [[15, 18, 21], 1, Detect, [nc]]
